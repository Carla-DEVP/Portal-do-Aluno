<{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno - Login</title>
    <link rel="stylesheet" href="{% static 'core/css/login.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="left-panel">
        <div class="login-container">
            <h2>Login</h2>
            <p>Digite seus dados institucionais</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <button type="submit" class="login-button">Entrar</button>
            </form>

            <div class="help-section">
                <p>Problemas para acessar?</p>
                <button class="get-help-button">Ajuda</button>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="illustration"></div>
        <h1>Bem-vindo ao Portal do Aluno</h1>
        <p class="subtitle">Acesse com seus dados institucionais</p>
    </div>
</body>
</html>
